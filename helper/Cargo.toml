[package]
name = "usage-meter-helper"
version = "0.1.0"
edition = "2021"
description = "The usage-meter mod's out-of-process work: today's spend, the git branch, the cached account limits"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
